[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fsm-ledger-guard"
version = "0.1.3"
description = "Auditoría algebraica de máquinas de estados financieras: ciclos con fuga, recursos retenidos y conservación de saldo"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alexis Romero" }]
keywords = ["fsm", "state-machine", "payment", "ledger", "sarif", "invariant", "money"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/alexisromtz-lab/fsm-ledger-guard"
Issues = "https://github.com/alexisromtz-lab/fsm-ledger-guard/issues"

[project.scripts]
fsm-ledger-guard = "fsm_ledger_guard.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fsm_ledger_guard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
